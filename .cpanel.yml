---
# ============================================================
# cPanel Git Version Control — ডিপ্লয়মেন্ট নির্দেশনা
# GitHub push → cPanel "Update from Remote" + "Deploy HEAD Commit" করলে চলে।
#
# ⚠️ এই হোস্টে rsync নেই — তাই cp দিয়ে কপি করা হয়।
# 🔴 নিরাপত্তা: cp শুধু repo-র ফাইল public_html-এ কপি/আপডেট করে; যেসব ফাইল
#    repo-তে নেই (config.php = পাসওয়ার্ড, uploads/ = ছবি) সেগুলো কপির উৎসেই
#    নেই, তাই কখনো ছোঁয়া/মোছা হয় না — সম্পূর্ণ নিরাপদ।
# কপির পর অপ্রয়োজনীয়/সংবেদনশীল জিনিস public_html থেকে সরানো হয়:
#    .git (হিস্ট্রি), .gitignore, .cpanel.yml, build/ (ডেভ), database/ (SQL —
#    মাইগ্রেশন phpMyAdmin-এ চলে, লাইভে দরকার নেই), *.md (ডকুমেন্ট), config.example.php
# ============================================================
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/cp -Rf . "$DEPLOYPATH"
    - /bin/rm -rf "$DEPLOYPATH/.git" "$DEPLOYPATH/.gitignore" "$DEPLOYPATH/.cpanel.yml" "$DEPLOYPATH/build" "$DEPLOYPATH/database" "$DEPLOYPATH/config.example.php"
    - /bin/rm -f "$DEPLOYPATH"/*.md
