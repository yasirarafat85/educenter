; 🔒 PHP2Shell (CVE-2026-109618 / CVE-2026-109619) — অপেক্ষার সময়ের ঢাল
;    যোগ করা হয়েছে ২০২৬-১০-২২
;
; PHP নিজের ভেতরের একটা গুরুতর বাগ (CVSS 9.2): লগইন ছাড়াই সার্ভারে কোড চালানো
; যায়। আসল সমাধান একটাই — হোস্টিং কোম্পানি PHP আপডেট করবে (ফিক্স করা ভার্সন:
; 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35)। নিচের লাইনটা সেই অপেক্ষার সময়ের ঢাল —
; দুটো বাগের একটার (CVE-2026-109619) প্রমাণিত পথটা বন্ধ করে।
;
; 🔴 এটা সম্পূর্ণ সমাধান নয়। PHP-র নিজের টিম বলছে এটা session-সংক্রান্ত পথগুলো
;    আটকায়, সব রূপ নয়। PHP আপডেট হয়ে গেলেও লাইনটা রেখে দিতে পারেন — ক্ষতি নেই।
;
; 🔴 আমাদের সাইট এই সুবিধা কোথাও ব্যবহার করে না (পুরো কোডবেসে ০ বার — যাচাই করা),
;    তাই বন্ধ করায় কিছুই ভাঙে না। পাবলিক সাইটে একটাও ফাইল-আপলোড ফর্মও নেই; ছয়টা
;    আপলোড ফর্মের সবগুলোই অ্যাডমিন লগইনের পেছনে — সেগুলোও অক্ষত থাকে।
;
; ⚠️ `.user.ini` কাজ করে শুধু PHP CGI/FastCGI/FPM হ্যান্ডলারে। হোস্ট mod_php (DSO)
;    চালালে ফাইলটা **নীরবে উপেক্ষিত** হয় — কোনো এরর আসে না, কিন্তু সুরক্ষাও বসে না।
;    সত্যিই বসেছে কিনা দেখতে: অ্যাডমিন → সেটিংস → 🩺 সিস্টেম চেক।
;    না বসলে cPanel → MultiPHP INI Editor → Editor Mode-এ একই লাইনটা যোগ করুন।
;
; ⚠️ `.htaccess`-এ `php_flag` দিয়ে করা হয়নি ইচ্ছাকৃতভাবে — mod_php না থাকলে ওটা
;    পুরো সাইট HTTP 500 করে ফেলত। `.user.ini` খারাপ ক্ষেত্রেও নিরাপদে বাদ যায়।
;
; ⚠️ `memory_limit = -1` (দ্বিতীয় বাগটার সুপারিশ) ইচ্ছাকৃতভাবে দেওয়া হয়নি —
;    শেয়ার্ড হোস্টিংয়ে ওটা সার্ভারের নিজের সীমার সাথে সংঘর্ষ করে সাইট অস্থির
;    করতে পারে। ওটার জন্য হোস্টের প্যাচই একমাত্র পথ।
; ─────────────────────────────────────────────────────────────────────────────

