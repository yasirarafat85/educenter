name: Build Clip Notes (Android)

# Builds the Clip Notes app on GitHub's servers so nothing needs to be
# installed on your own computer.
#   * Debug APK  -> always built, install it on your phone to test.
#   * Release AAB -> built only after you add the signing Secrets, upload to Play Store.

on:
  push:
    paths:
      - "android-apps/clipnotes/**"
      - ".github/workflows/android-clipnotes.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-apps/clipnotes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Decode signing keystore (only if Secrets are set)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIPNOTES_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No signing Secrets found — skipping the release AAB. That is expected before you set up publishing."
          fi

      - name: Build signed release AAB (for Google Play)
        if: steps.signing.outputs.have_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.CLIPNOTES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLIPNOTES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLIPNOTES_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clipnotes-debug-apk
          path: android-apps/clipnotes/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        if: steps.signing.outputs.have_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clipnotes-release-aab
          path: android-apps/clipnotes/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
